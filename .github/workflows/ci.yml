name: test-xu-lab-vpl-ti

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . pytest
      - name: Unit tests
        run: python -m pytest
      - name: Syntax check
        run: python -m py_compile streamlit_app.py app_advanced.py scripts/*.py ti_vpl/*.py
